[package]
name = "zkp-core"
version = "0.1.0"
edition = "2021"
# Explicit, not implied by the edition (pre-read P36-3): the `test-observers`
# feature must never unify into a release build; resolver v2 is what keeps a
# dev-dependency's feature out of it.
resolver = "2"
publish = false
description = "Maintained CPU proof primitives extracted from hashline; experimental protocol security"

[features]
# [ZK60 stage 36] The READ-ONLY TEST OBSERVERS: `ZkRng::consumed_bytes` /
# `ZkRng::refills` and `Transcript::squeezes`. Every line they add is inside
# `#[cfg(any(test, feature = "test-observers"))]`, so a build without this
# feature compiles the same code paths it always did.
#
# It exists because `cfg(test)` is NOT enabled in this crate when a
# DEPENDENT's tests link it: hashline's lane tests see zkp-core as an
# ordinary library. A dependent that needs the observers switches this on in
# its `[dev-dependencies]` — where it reaches test targets and nothing else.
#
# It is deliberately NOT in `default` and NOT in any normal dependency of any
# crate. Nothing in the library, the binary or a release build turns it on.
test-observers = []

[dependencies]
blake3 = "1.8"
rayon = "1.11"
sha2 = "0.10"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
debug = false
